<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280, initial-scale=1"/>
<title>Stock Thesis · Editorial Quant UI Kit</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="root" class="app-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="GroundedClaim.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="StockCard.jsx"></script>
<script type="text/babel" src="PriceChart.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="StockScreen.jsx"></script>
<script type="text/babel" src="CompareScreen.jsx"></script>

<script type="text/babel">
  const { useState } = React;

  function App() {
    const [route, setRoute] = useState({ screen: 'home', params: {} });

    function go(screen, params = {}) {
      setRoute({ screen, params });
      window.scrollTo(0, 0);
    }

    let body;
    if      (route.screen === 'stock')   body = <StockScreen   symbol={route.params.symbol}   go={go} />;
    else if (route.screen === 'compare') body = <CompareScreen symbols={route.params.symbols} go={go} />;
    else                                  body = <HomeScreen go={go} />;

    return (
      <div data-screen-label={`Stock Thesis — ${route.screen.toUpperCase()}`}>
        <Header current={route.screen} go={go} />
        {body}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
