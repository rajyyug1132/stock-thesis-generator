<!doctype html>
<html><head><meta charset="utf-8"><title>Mono numbers</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">

  <div style="display:grid;grid-template-columns:auto auto;gap:10px 22px;align-items:baseline">
    <span class="num" style="font-size:32px;color:var(--text-primary)">₹3,184.20</span>
    <span class="num" style="font-size:13px;color:var(--text-tertiary);letter-spacing:0.04em">CURRENT · 32PX</span>

    <span class="num" style="font-size:13px;color:var(--text-tertiary);letter-spacing:0.04em">METHOD · 11PX MICRO</span>

  <div style="margin-top:14px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">
    TABULAR NUMS · ZERO SLASHED · NEGATIVE TRACKING
  </div>
</div></body></html>
