<!doctype html>
<html><head><meta charset="utf-8"><title>Method strip</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card" style="padding:0">
  <div style="background:#131210;border-top:1px solid #26221f;border-bottom:1px solid #26221f;padding:24px 28px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="num" style="font-size:11px;color:#a8c7ba;letter-spacing:0.1em">01</span>
          <span style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:#6c665e">LIVE DATA</span>
        </div>
        <p style="margin:0;color:#6c665e;font-size:13px;line-height:1.55">Yahoo Finance prices, fundamentals, and news fetched at request time.</p>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="num" style="font-size:11px;color:#a8c7ba;letter-spacing:0.1em">02</span>
          <span style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:#6c665e">GEMINI PRO THESIS</span>
        </div>
        <p style="margin:0;color:#6c665e;font-size:13px;line-height:1.55">Structured JSON output: summary, bull, bear, risks, catalysts.</p>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="num" style="font-size:11px;color:#a8c7ba;letter-spacing:0.1em">03</span>
          <span style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:#6c665e">FLASH VALIDATION</span>
        </div>
        <p style="margin:0;color:#6c665e;font-size:13px;line-height:1.55">Every claim checked against source. Grounded vs unverified — shown inline.</p>
      </div>
    </div>
  </div>
</div></body></html>
