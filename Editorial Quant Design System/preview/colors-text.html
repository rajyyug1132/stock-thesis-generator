<!doctype html>
<html><head><meta charset="utf-8"><title>Text colors</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:18px">TEXT · BONE-WHITE FAMILY</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 32px">
    <div>
      <div style="color:#e6e2dd;font-size:18px;font-weight:500">Primary — bone-white</div>
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.05em;margin-top:2px">#E6E2DD · headlines, body</div>
    </div>
    <div>
      <div style="color:#a6a098;font-size:15px">Secondary — muted</div>
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.05em;margin-top:2px">#A6A098 · descriptions</div>
    </div>
    <div>
      <div style="color:#6c665e;font-size:13px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em">Tertiary — captions</div>
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.05em;margin-top:2px">#6C665E · axis ticks, "EV ·"</div>
    </div>
    <div>
      <div style="color:#46413a;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.15em">Quaternary — hairline</div>
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.05em;margin-top:2px">#46413A · faintest labels</div>
    </div>
  </div>
</div></body></html>
