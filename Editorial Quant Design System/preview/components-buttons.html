<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:18px">BUTTONS  ·  MONO LABEL  ·  SHARP CORNERS</div>
  <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
    <a style="font-family:var(--font-mono);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 24px;background:#a8c7ba;color:#0b0a09;text-decoration:none">COMPARE STOCKS →</a>
    <a style="font-family:var(--font-mono);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 24px;border:1px solid #3a342d;color:#a6a098;background:transparent;text-decoration:none">SAMPLE THESIS</a>
    <a style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 20px;border:1px solid #3a342d;color:#6c665e;background:transparent;text-decoration:none">TRY WITH RELIANCE · TCS →</a>
  </div>
  <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center">
    <button style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;background:#211e1b;color:#a6a098;border:1px solid #26221f;cursor:pointer">FILTER</button>
    <button style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;background:#3d5249;color:#e6e2dd;border:1px solid #a8c7ba;cursor:pointer">ACTIVE</button>
    <button disabled style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;background:transparent;color:#a6a098;border:1px solid #26221f;opacity:0.4;cursor:not-allowed">DISABLED</button>
  </div>
  <div style="margin-top:14px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">
    HOVER: OPACITY 0.8 · PRESS: TRANSLATE-Y 1PX · FOCUS: 1PX ACCENT OUTLINE
  </div>
</div></body></html>
