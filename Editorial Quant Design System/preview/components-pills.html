<!doctype html>
<html><head><meta charset="utf-8"><title>Pills</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:18px">PILL VARIANTS  ·  MONO UPPERCASE  ·  SHARP CORNERS</div>
  <div style="display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center">
    <span style="display:inline-flex;align-items:center;border:1px solid #26221f;background:transparent;color:#a6a098;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">DEFAULT</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #a8c7ba;background:rgba(168,199,186,0.10);color:#a8c7ba;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">UP · GROUNDED</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #c98a7a;background:rgba(201,138,122,0.10);color:#c98a7a;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">DOWN · HIGH RISK</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #b8a382;background:transparent;color:#b8a382;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">UNVERIFIED</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #26221f;background:transparent;color:#a6a098;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">NIFTY 50</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #26221f;background:transparent;color:#a6a098;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">CACHED</span>
    <span style="display:inline-flex;align-items:center;border:1px solid #a8c7ba;background:transparent;color:#a8c7ba;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px;line-height:1.4">FRESH</span>
  </div>
  <!-- severity row -->
  <div style="margin-top:18px;display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:13px;color:var(--text-secondary)">
    <span style="border:1px solid #26221f;color:#a6a098;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px">LOW</span>
    <span style="border:1px solid #b8a382;color:#b8a382;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px">MEDIUM</span>
    <span style="border:1px solid #c98a7a;color:#c98a7a;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;padding:2px 8px">HIGH</span>
    <span style="color:var(--text-tertiary);font-size:11px;letter-spacing:0.1em;text-transform:uppercase">RISK SEVERITY SCALE  →</span>
  </div>
</div></body></html>
