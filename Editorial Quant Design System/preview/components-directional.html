<!doctype html>
<html><head><meta charset="utf-8"><title>Directional num</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:18px">DIRECTIONAL NUM  ·  TRIANGLE + SIGN + UNIT</div>
  <div style="display:grid;grid-template-columns:auto 1fr;gap:14px 28px;align-items:baseline">
    <span class="num" style="font-size:26px;color:#a8c7ba"><span style="font-size:0.7em">▲</span> +18.43%</span>
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-tertiary);text-transform:uppercase">POSITIVE · 1Y RETURN</span>

    <span class="num" style="font-size:26px;color:#c98a7a"><span style="font-size:0.7em">▼</span> −4.21%</span>
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-tertiary);text-transform:uppercase">NEGATIVE · INTRADAY</span>

    <span class="num" style="font-size:26px;color:#a6a098"><span style="font-size:0.7em">·</span> 0.00%</span>
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-tertiary);text-transform:uppercase">NEUTRAL · FLAT</span>

    <span class="num" style="font-size:18px;color:#a8c7ba"><span style="font-size:0.7em">▲</span> +1.24σ</span>
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-tertiary);text-transform:uppercase">SHARPE · STANDARDIZED</span>
  </div>
</div></body></html>
