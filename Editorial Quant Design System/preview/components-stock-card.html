<!doctype html>
<html><head><meta charset="utf-8"><title>Stock card</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:14px">STOCK CARD  ·  FEATURED GRID ITEM</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px">
    <div style="background:#131210;border:1px solid #26221f;padding:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div class="num" style="font-size:15px;color:#e6e2dd;font-weight:600;letter-spacing:0.03em">RELIANCE</div>
          <div style="font-size:11px;color:#6c665e;margin-top:2px">Reliance Industries Ltd.</div>
        </div>
        <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.07em;padding:2px 7px;border:1px solid #26221f;color:#6c665e">OIL & GAS</span>
      </div>
      <!-- sparkline -->
      <svg width="100%" height="34" viewBox="0 0 240 34" preserveAspectRatio="none" style="display:block;margin:10px 0">
        <polyline points="0,28 20,26 40,24 60,28 80,22 100,18 120,20 140,14 160,16 180,10 200,12 220,6 240,4" fill="none" stroke="#a8c7ba" stroke-width="1.5"/>
      </svg>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="num" style="font-size:15px;color:#e6e2dd">₹3,184.20</span>
        <span class="num" style="font-size:13px;color:#a8c7ba">+18.4%</span>
      </div>
    </div>
    <div style="background:#131210;border:1px solid #26221f;padding:18px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div class="num" style="font-size:15px;color:#e6e2dd;font-weight:600;letter-spacing:0.03em">TATAMOTORS</div>
          <div style="font-size:11px;color:#6c665e;margin-top:2px">Tata Motors Ltd.</div>
        </div>
        <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.07em;padding:2px 7px;border:1px solid #26221f;color:#6c665e">AUTO</span>
      </div>
      <svg width="100%" height="34" viewBox="0 0 240 34" preserveAspectRatio="none" style="display:block;margin:10px 0">
        <polyline points="0,8 20,12 40,10 60,14 80,18 100,16 120,22 140,18 160,24 180,22 200,26 220,24 240,28" fill="none" stroke="#c98a7a" stroke-width="1.5"/>
      </svg>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="num" style="font-size:15px;color:#e6e2dd">₹742.10</span>
        <span class="num" style="font-size:13px;color:#c98a7a">−4.2%</span>
      </div>
    </div>
  </div>
</div></body></html>
