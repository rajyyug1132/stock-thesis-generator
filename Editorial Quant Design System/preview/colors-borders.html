<!doctype html>
<html><head><meta charset="utf-8"><title>Borders</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:14px">BORDERS · RULES · 1PX ONLY</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
    <div style="border:1px solid #26221f;background:#131210;padding:18px 14px">
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.04em">#26221F</div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--text-secondary);text-transform:uppercase;margin-top:4px">BORDER · SUBTLE</div>
    </div>
    <div style="border:1px solid #3a342d;background:#131210;padding:18px 14px">
      <div class="num" style="font-size:11px;color:var(--text-tertiary);letter-spacing:0.04em">#3A342D</div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--text-secondary);text-transform:uppercase;margin-top:4px">BORDER · STRONG</div>
    </div>
    <div style="border:1px solid #a8c7ba;background:#131210;padding:18px 14px">
      <div class="num" style="font-size:11px;color:#a8c7ba;letter-spacing:0.04em">#A8C7BA</div>
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:#a8c7ba;text-transform:uppercase;margin-top:4px">BORDER · ACCENT</div>
    </div>
  </div>
  <!-- dotted divider sample -->
  <div style="margin-top:18px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--text-tertiary);text-transform:uppercase">HAIRLINE DOTTED · DATA-ROW DIVIDER</div>
  <div style="background-image:linear-gradient(to right, #26221f 50%, transparent 50%);background-size:4px 1px;background-position:bottom;background-repeat:repeat-x;height:1px;margin-top:6px"></div>
  <div style="background-image:linear-gradient(to right, #26221f 50%, transparent 50%);background-size:4px 1px;background-position:bottom;background-repeat:repeat-x;height:1px;margin-top:18px"></div>
  <div style="background-image:linear-gradient(to right, #26221f 50%, transparent 50%);background-size:4px 1px;background-position:bottom;background-repeat:repeat-x;height:1px;margin-top:18px"></div>
</div></body></html>
