<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">

    </div>

    </div>
    <div style="flex:1;background:#1a1816;height:120px;border:1px solid var(--border-subtle);border-left:none;padding:10px 12px">

      <div style="position:absolute;bottom:32px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--text-tertiary);text-transform:uppercase">CARD</div>
    </div>
    <div style="flex:1;background:#211e1b;height:120px;border:1px solid var(--border-subtle);border-left:none;padding:10px 12px">

      <div style="position:absolute;bottom:32px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--text-tertiary);text-transform:uppercase">INPUT</div>
    </div>
    <div style="flex:1;background:#2a2622;height:120px;border:1px solid var(--border-subtle);border-left:none;padding:10px 12px">
      <div class="num" style="font-size:11px;color:var(--text-secondary);letter-spacing:0.04em">#2A2622</div>
      <div style="position:absolute;bottom:32px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;color:var(--text-tertiary);text-transform:uppercase">RULE</div>

  <div style="margin-top:12px;color:var(--text-tertiary);font-size:11px;font-family:var(--font-mono);letter-spacing:0.05em">Elevation comes from background-color steps. No shadows.</div>
