<!doctype html>
<html><head><meta charset="utf-8"><title>Accent + Directional</title>
<link rel="stylesheet" href="_card.css">

    </div>
    <div style="background:#c98a7a;height:96px;padding:10px 12px;color:#0b0a09;display:flex;flex-direction:column;justify-content:space-between">

      <div style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.15em">DOWN</div>

    <div style="background:#b8a382;height:96px;padding:10px 12px;color:#0b0a09;display:flex;flex-direction:column;justify-content:space-between">

  </div>
  <div style="margin-top:14px;display:flex;gap:18px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">
    <span class="num" style="color:#a8c7ba"><span style="font-size:9px">▲</span> +18.4%</span>
    <span class="num" style="color:#c98a7a"><span style="font-size:9px">▼</span> −4.2%</span>
    <span class="num" style="color:var(--text-tertiary)"><span style="font-size:9px">·</span>  0.0%</span>
