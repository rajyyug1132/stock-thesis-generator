<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="section-label" style="margin-bottom:14px">SPACING · 8PT GRID  ·  XS → 3XL</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:14px"><div style="width:4px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">4px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">XS · inline icon gaps</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:8px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">8px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">SM · pill padding, chip gaps</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:16px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">16px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">MD · row gap, panel padding</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:24px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">24px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">LG · card padding</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:40px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">40px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">XL · sub-section gap</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:64px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">64px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">2XL · section rhythm</span></div>
    <div style="display:flex;align-items:center;gap:14px"><div style="width:96px;height:14px;background:#a8c7ba"></div><span class="num" style="font-size:12px;color:var(--text-secondary);width:48px">96px</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);letter-spacing:0.1em;text-transform:uppercase">3XL · hero blocks</span></div>
  </div>
</div></body></html>
